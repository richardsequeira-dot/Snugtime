<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Invaders</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Space Invaders</h1>
      <canvas id="game" width="800" height="600" aria-label="Space Invaders game"></canvas>
      <div class="hud">
        <span id="score">Score: 0</span>
        <span id="highscore">Best: 0</span>
        <span id="weapon">Normal</span>
        <span id="lives">Lives: 3</span>
        <span id="wave">Wave: 1</span>
        <button id="mute" type="button" title="Toggle sound (M)">Sound: ON</button>
      </div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
